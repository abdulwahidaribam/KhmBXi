name: Bug report
description: Report a problem in behavior that exists in the current repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Check that the behavior you are reporting exists in the current project. Do not include credentials, private data, or security vulnerability details here.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, browser, runtime, or version details, if known.
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove credentials, tokens, personal data, and other secrets before sharing logs.
